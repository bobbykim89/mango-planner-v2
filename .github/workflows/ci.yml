name: CI

on:
  pull_request:
  push:
    branches: [master]

# A pull request shares one group per ref, so a newer push cancels its older
# run. A push to master gets a group per commit: GitHub cancels a *pending* run
# whenever another is queued in the same group, even with cancel-in-progress
# false, so a shared master group would drop the middle run of three quick
# merges.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# `test` and `lint` are the check names master's branch protection requires.
# Renaming a job means renaming it there too, or every pull request waits
# forever on a check that never reports.
jobs:
  # fast checks that don't build the app
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # no version input: reads `packageManager` from package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
